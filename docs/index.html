<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="asset/maskface.ico" type="image/x-icon">
<title>MaskFace — 视频人脸匿名化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
  h1 { text-align: center; font-size: 28px; margin-bottom: 8px; }
  .sub { text-align: center; color: #666; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .card h2 { font-size: 18px; margin-bottom: 12px; }
  .card .label { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; }
  .label-in { background: #e8f0fe; color: #196ebf; }
  .label-out { background: #e6f4ea; color: #1e8e3e; }
  video { width: 100%; border-radius: 8px; display: block; }
  .logo { width: 40px; height: 40px; margin-right: 8px; position: relative; top: 10px; }
</style>
</head>
<body>
<div class="container">
  <h1><img class="logo" src="asset/mask.png" alt="MaskFace"> MaskFace</h1>
  <p class="sub">视频人脸自动检测 &amp; 模糊处理</p>
  <div class="grid">
    <div class="card">
      <h2><span class="label label-in">处理前</span></h2>
      <video src="input.mp4" controls muted></video>
    </div>
    <div class="card">
      <h2><span class="label label-out">处理后</span></h2>
      <video src="output.mp4" controls muted></video>
    </div>
  </div>
</div>
</body>
</html>
